name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Salin nada alarm ke resource Android
        run: |
          mkdir -p android/app/src/main/res/raw
          cp www/sounds/*.wav android/app/src/main/res/raw/
      - name: Pasang kode alarm layar penuh & input suara
        run: |
         D=android/app/src/main/java/com/taskalarm/pro
          mkdir -p $D
          find java -name '*.java' -exec cp {} $D/ \;
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/></manifest>#' $M
          sed -i 's#</application>#<activity android:name=".AlarmActivity" android:exported="false" android:launchMode="singleInstance" android:taskAffinity="" android:excludeFromRecents="true" android:showWhenLocked="true" android:turnScreenOn="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar"/><service android:name=".AlarmService" android:exported="false" android:foregroundServiceType="mediaPlayback"/><receiver android:name=".AlarmReceiver" android:exported="false"/><receiver android:name=".BootReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/><action android:name="android.intent.action.MY_PACKAGE_REPLACED"/></intent-filter></receiver></application>#' $M      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TaskAlarmPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
