<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TaskAlarm Pro</title>
<style>
:root{--bg:#f4f6fb;--c:#fff;--t:#1e293b;--m:#64748b;--p:#4f46e5;--b:#e2e8f0}
.dark{--bg:#0f172a;--c:#1e293b;--t:#f1f5f9;--m:#94a3b8;--b:#334155}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:6px;padding:12px 14px;background:var(--p);color:#fff;position:sticky;top:0;z-index:5}header b{flex:1;font-size:18px}
header button{background:#fff2;border:0;color:#fff;border-radius:10px;padding:6px 9px;font-size:16px}
#main{padding:12px 14px 150px}h2{margin:6px 0}h3{margin:16px 0 6px}small,.m{color:var(--m)}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin:8px 0}
.it{display:flex;gap:10px;align-items:center}.it .g{flex:1;display:flex;flex-direction:column;gap:3px}.it button{background:none;border:0;font-size:18px}
.chip{color:#fff;border-radius:20px;padding:1px 8px;font-size:12px;align-self:flex-start}
.bar{height:10px;background:var(--b);border-radius:9px;margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;padding:8px 0;color:var(--m);font-size:11px}nav button span{display:block;font-size:20px}nav .on{color:var(--p);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--p);color:#fff;font-size:30px;z-index:7;box-shadow:0 4px 14px #0005}
input,select,textarea,.btn{width:100%;padding:10px;margin:4px 0;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);font:inherit}
input[type=checkbox]{width:22px;height:22px;margin:0}.btn{background:var(--p);color:#fff;border:0;text-align:center}.btn.s{background:var(--b);color:var(--t)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0}.tabs button{white-space:nowrap;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:20px;padding:6px 12px}.tabs .on{background:var(--p);color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}.lbl{display:flex;justify-content:space-between;align-items:center;padding:8px 0}.lbl input{width:auto}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.grid div{padding:6px 0;border-radius:10px;min-height:40px}.grid .sel{background:var(--p);color:#fff}.grid .tdy{border:1px solid var(--p)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin:0 1px}
#modal{position:fixed;inset:0;background:#0008;z-index:20;display:none}#modal.on{display:block}.sheet{position:absolute;bottom:0;left:0;right:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:14px}
#toast{position:fixed;top:70px;left:14px;right:14px;background:#111;color:#fff;padding:12px;border-radius:12px;z-index:30;display:none}
.col{display:flex;align-items:flex-end;gap:8px;height:110px}.col div{flex:1;background:var(--p);border-radius:6px 6px 0 0;text-align:center;color:#fff;font-size:11px;min-height:4px}
</style></head><body>
<header><b>⏰ TaskAlarm Pro</b><button onclick="go('alarm')">🔔</button><button onclick="go('hist')">📂</button><button onclick="go('sync')">☁️</button><button onclick="go('ai')">🤖</button></header>
<div id="main"></div><div id="toast"></div><div id="modal"></div>
<button class="fab" onclick="openForm()">＋</button>
<nav id="nav"></nav>
<script>
const CATS={Pekerjaan:['💼','#2563eb'],Meeting:['🤝','#7c3aed'],Keluarga:['👨‍👩‍👧','#ec4899'],Keuangan:['💰','#16a34a'],Acara:['🎂','#f59e0b'],Kesehatan:['🏥','#ef4444'],Pendidikan:['📚','#0ea5e9'],Perjalanan:['✈️','#14b8a6'],Belanja:['🛒','#f97316'],Lainnya:['✅','#64748b']};
const P={Tinggi:'🔴',Sedang:'🟡',Rendah:'🟢'},$=s=>document.querySelector(s),K='taskalarm.v1';
let S=JSON.parse(localStorage.getItem(K)||'null')||{tasks:[],hist:[],note:'',set:{dark:false,sound:'Default',vib:true,dur:30,full:true,target:40}};
const save=()=>localStorage.setItem(K,JSON.stringify(S)),pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},TD=()=>ds(new Date());
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const srt=(a,b)=>(a.date+(a.start||'')).localeCompare(b.date+(b.start||''));
let V='home',F={tab:'Semua',prio:'',cat:'',dl:''},CAL={m:'m',sel:TD(),cat:'',ref:new Date()},H='Selesai',M={},SN=10;
const LN=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
const TONES={default:{n:'Default (sistem)'},lonceng:{n:'Lonceng',f:'tone_lonceng.wav'},digital:{n:'Digital',f:'tone_digital.wav'},lembut:{n:'Lembut',f:'tone_lembut.wav'},sirene:{n:'Sirene',f:'tone_sirene.wav'}};
const tk=s=>{s=String(s||'').toLowerCase();return TONES[s]?s:'default'},chId=(k,vb)=>'alarm_'+k+(vb?'_v':'_q');
let AU;function playTone(k){k=tk(k);if(AU){AU.pause();AU=null}if(!TONES[k].f)return toast('Default memakai nada alarm bawaan HP');AU=new Audio('sounds/'+TONES[k].f);AU.play().catch(()=>toast('Tidak bisa memutar suara'));setTimeout(()=>AU&&AU.pause(),6000)}
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',3500)}
async function initN(){const n=LN();if(!n)return;try{await n.requestPermissions();for(const k of Object.keys(TONES))for(const vb of [1,0]){const c={id:chId(k,vb),name:'Alarm '+TONES[k].n+(vb?' + getar':''),importance:5,vibration:!!vb,visibility:1};if(TONES[k].f)c.sound=TONES[k].f;await n.createChannel(c)}n.addListener('localNotificationReceived',()=>checkPast())}catch(e){}}
const aDate=t=>{const d=new Date(t.date+'T'+(t.start||'00:00')+':00');d.setMinutes(d.getMinutes()-(t.remind||0));return d};
async function sched(t){const n=LN();if(!n)return;try{await n.cancel({notifications:[{id:t.id}]});if(!t.alarm||t.status!='todo'||!t.date||!t.start)return;const at=aDate(t);if(at<=new Date()&&!t.repeat)return;const s={at,allowWhileIdle:true};if(t.repeat)s.every=t.repeat;await n.schedule({notifications:[{id:t.id,title:'⏰ '+t.title,body:(t.loc?'📍'+t.loc+' · ':'')+'Mulai '+t.start,schedule:s,channelId:chId(tk(t.sound),t.vib!==false)}]})}catch(e){}}
function checkPast(){let ch=0;S.tasks.forEach(t=>{if(t.alarm&&t.status=='todo'&&!t.fired&&t.date&&t.start&&aDate(t)<=new Date()){t.fired=true;S.hist.unshift({title:t.title,at:aDate(t).toISOString()});toast('⏰ '+t.title+' ('+t.start+')');ch=1}});if(ch){save();render()}}
const nextAlarm=()=>S.tasks.filter(t=>t.alarm&&t.status=='todo'&&t.date&&t.start&&aDate(t)>new Date()).sort((a,b)=>aDate(a)-aDate(b))[0];
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const card=t=>`<div class="card it"><input type=checkbox ${t.status=='done'?'checked':''} onchange="tog(${t.id})"><div class=g onclick="openForm(${t.id})"><b>${esc(t.title)}</b><small>${t.date||''} ${t.start||''}${t.end?'–'+t.end:''} ${t.alarm?'⏰':''} ${P[t.prio]}</small><span class=chip style="background:${CATS[t.cat][1]}">${CATS[t.cat][0]} ${t.cat}</span></div><button onclick="setSt(${t.id},'cancel')">🗑</button></div>`;
function tog(id){const t=S.tasks.find(x=>x.id==id);t.status=t.status=='done'?'todo':'done';t.doneAt=t.status=='done'?Date.now():null;save();sched(t);render()}
function setSt(id,s){const t=S.tasks.find(x=>x.id==id);t.status=s;save();sched(t);render()}
const wkDone=()=>S.tasks.filter(t=>t.status=='done'&&t.doneAt&&t.doneAt>Date.now()-7*864e5).length;
function home(){const T=TD(),a=S.tasks.filter(t=>t.status=='todo'),td=S.tasks.filter(t=>t.date==T&&(t.status=='todo'||t.status=='done')),dn=td.filter(t=>t.status=='done').length,pr=td.length?Math.round(dn/td.length*100):0,up=td.filter(t=>t.status=='todo').sort(srt),h=new Date().getHours(),g=h<11?'Pagi':h<15?'Siang':h<19?'Sore':'Malam',nx=nextAlarm(),dl=a.filter(t=>t.date>=T).sort(srt)[0],bl=a.filter(t=>t.cat=='Belanja');
return `<h2>Halo, Selamat ${g}</h2><div class=card><b>${a.length} Tugas Aktif</b><br>${up.length} Deadline Hari Ini<div class=bar><i style="width:${pr}%"></i></div><small>Progress Hari Ini ${pr}%</small></div>
<div class=row><button class=btn onclick="openForm()">➕ Tambah Cepat</button><button class="btn s" onclick="go('ai')">🤖 Input AI</button></div>
<h3>Jadwal Hari Ini</h3>${up.map(card).join('')||'<p class=m>Tidak ada jadwal tersisa hari ini</p>'}
<h3>Alarm Berikutnya</h3><div class=card>${nx?`<b>${esc(nx.title)}</b><br>${hm(aDate(nx))} WIB · ${nx.date}`:'Belum ada alarm aktif'}</div>
<h3>Deadline Terdekat</h3>${dl?card(dl):'<p class=m>Tidak ada</p>'}
<h3>Target Mingguan</h3><div class=card>${wkDone()}/${S.set.target} tugas selesai<div class=bar><i style="width:${Math.min(100,wkDone()/S.set.target*100)}%"></i></div></div>
<h3>🛒 Rencana Belanja</h3>${bl.map(card).join('')||'<p class=m>Belum ada rencana belanja</p>'}
<h3>📝 Catatan Harian</h3><textarea rows=4 placeholder="Tulis catatan hari ini..." oninput="S.note=this.value;save()">${esc(S.note)}</textarea>`}
function cal(){const r=CAL.ref,y=r.getFullYear(),mo=r.getMonth(),T=TD();let L=S.tasks.filter(t=>t.status=='todo'&&(!CAL.cat||t.cat==CAL.cat));
let o=`<div class=tabs>${[['m','Bulanan'],['w','Mingguan'],['a','Agenda']].map(x=>`<button class="${CAL.m==x[0]?'on':''}" onclick="CAL.m='${x[0]}';render()">${x[1]}</button>`).join('')}</div><select onchange="CAL.cat=this.value;render()"><option value="">Semua kategori</option>${Object.keys(CATS).map(c=>`<option ${CAL.cat==c?'selected':''}>${c}</option>`).join('')}</select>`;
if(CAL.m=='m'){const f=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate();o+=`<div class=row><button class="btn s" onclick="CAL.ref=new Date(${y},${mo-1},1);render()">◀</button><h3 style="text-align:center">${r.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</h3><button class="btn s" onclick="CAL.ref=new Date(${y},${mo+1},1);render()">▶</button></div><div class=grid>${'MSSRKJS'.split('').map(x=>`<small>${x}</small>`).join('')}`.replace('MSSRKJS','');
o=o.replace(/<div class=grid>.*$/,'')+`<div class=grid>${['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(x=>`<small>${x}</small>`).join('')}${'<div></div>'.repeat(f)}`;
for(let d=1;d<=n;d++){const k=y+'-'+pad(mo+1)+'-'+pad(d);o+=`<div class="${k==CAL.sel?'sel':''} ${k==T?'tdy':''}" onclick="CAL.sel='${k}';render()">${d}<br>${L.filter(t=>t.date==k).slice(0,3).map(t=>`<span class=dot style="background:${CATS[t.cat][1]}"></span>`).join('')}</div>`}
o+=`</div><h3>${CAL.sel}</h3>`+(L.filter(t=>t.date==CAL.sel).sort(srt).map(card).join('')||'<p class=m>Tidak ada kegiatan</p>')}
else if(CAL.m=='w'){for(let i=0;i<7;i++){const k=ds(add(new Date(),i));o+=`<h3>${add(new Date(),i).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short'})}</h3>`+(L.filter(t=>t.date==k).sort(srt).map(card).join('')||'<small>—</small>')}}
else o+=L.filter(t=>t.date>=T).sort(srt).map(card).join('')||'<p class=m>Belum ada agenda</p>';return o}
function tasks(){const T=TD(),B=ds(add(new Date(),1)),W=ds(add(new Date(),7)),f={Semua:t=>t.status=='todo','Hari Ini':t=>t.status=='todo'&&t.date==T,Besok:t=>t.status=='todo'&&t.date==B,'Minggu Ini':t=>t.status=='todo'&&t.date>=T&&t.date<=W,Selesai:t=>t.status=='done'}[F.tab];
const l=S.tasks.filter(f).filter(t=>!F.prio||t.prio==F.prio).filter(t=>!F.cat||t.cat==F.cat).filter(t=>!F.dl||t.date==F.dl).sort(srt);
return `<div class=tabs>${['Semua','Hari Ini','Besok','Minggu Ini','Selesai'].map(x=>`<button class="${F.tab==x?'on':''}" onclick="F.tab='${x}';render()">${x}</button>`).join('')}</div><div class=row><select onchange="F.prio=this.value;render()"><option value="">Prioritas</option>${Object.keys(P).map(p=>`<option ${F.prio==p?'selected':''}>${p}</option>`).join('')}</select><select onchange="F.cat=this.value;render()"><option value="">Kategori</option>${Object.keys(CATS).map(c=>`<option ${F.cat==c?'selected':''}>${c}</option>`).join('')}</select></div><input type=date value="${F.dl}" onchange="F.dl=this.value;render()">${l.map(card).join('')||'<p class=m>Tidak ada tugas</p>'}`}
function stats(){const dn=S.tasks.filter(t=>t.status=='done'),pd=S.tasks.filter(t=>t.status=='todo'),days=[...Array(7)].map((_,i)=>{const d=add(new Date(),i-6),k=ds(d);return[d.toLocaleDateString('id-ID',{weekday:'short'}),dn.filter(t=>t.doneAt&&ds(new Date(t.doneAt))==k).length]}),mx=Math.max(1,...days.map(x=>x[1])),hrs={};S.tasks.forEach(t=>{if(t.start){const h=t.start.slice(0,2);hrs[h]=(hrs[h]||0)+1}});const bh=Object.entries(hrs).sort((a,b)=>b[1]-a[1])[0],perDay={};dn.forEach(t=>{if(t.doneAt){const k=ds(new Date(t.doneAt));perDay[k]=(perDay[k]||0)+1}});
const A=[['🎯','Tugas Pertama',dn.length>=1],['🔥','10 Tugas Selesai',dn.length>=10],['🏆','50 Tugas Selesai',dn.length>=50],['⚡','5 Tugas dalam 1 Hari',Math.max(0,...Object.values(perDay))>=5],['⏰','10 Alarm Berbunyi',S.hist.length>=10],['📈','Target Mingguan Tercapai',wkDone()>=S.set.target]];
return `<div class=row><div class=card><h2>${dn.length}</h2>Tugas Selesai</div><div class=card><h2>${pd.length}</h2>Tugas Tertunda</div></div><h3>Produktivitas 7 Hari</h3><div class="card col">${days.map(d=>`<div style="height:${d[1]/mx*100}%">${d[1]}<br></div>`).join('')}</div><div class="row" style="text-align:center">${days.map(d=>`<small style="flex:1">${d[0]}</small>`).join('')}</div>
<h3>Jam Tersibuk</h3><div class=card>${bh?bh[0]+':00 ('+bh[1]+' kegiatan)':'Belum ada data'}</div><h3>Target Mingguan</h3><div class=card>${wkDone()}/${S.set.target}<div class=bar><i style="width:${Math.min(100,wkDone()/S.set.target*100)}%"></i></div></div><h3>🏅 Pencapaian</h3>${A.map(a=>`<div class=card style="opacity:${a[2]?1:.4}">${a[0]} <b>${a[1]}</b> ${a[2]?'✔':'🔒'}</div>`).join('')}`}
function alarm(){const a=S.tasks.filter(t=>t.alarm&&t.status=='todo'&&t.date&&aDate(t)>new Date()).sort((x,y)=>aDate(x)-aDate(y));
return `<h2>🔔 Alarm</h2><h3>Alarm Aktif</h3><label class=m>Snooze (menit)</label><select onchange="SN=+this.value">${[5,10,15,30].map(m=>`<option ${SN==m?'selected':''}>${m}</option>`).join('')}</select>${a.map(t=>`<div class="card it"><div class=g><b>${esc(t.title)}</b><small>${hm(aDate(t))} · ${t.date}</small></div><button onclick="snooze(${t.id})">😴</button></div>`).join('')||'<p class=m>Tidak ada alarm aktif</p>'}<h3>Riwayat Alarm</h3>${S.hist.slice(0,30).map(h=>`<div class=card>${esc(h.title)}<br><small>${new Date(h.at).toLocaleString('id-ID')}</small></div>`).join('')||'<p class=m>Belum ada</p>'}`}
async function snooze(id){const t=S.tasks.find(x=>x.id==id),n=LN(),at=new Date(Date.now()+SN*6e4);if(n){try{await n.schedule({notifications:[{id:t.id,title:'⏰ (Snooze) '+t.title,body:'Ditunda '+SN+' menit',schedule:{at,allowWhileIdle:true},channelId:chId(tk(t.sound),t.vib!==false)}]})}catch(e){}}toast('Alarm ditunda '+SN+' menit → '+hm(at))}
function hist(){const m={Selesai:'done',Dibatalkan:'cancel',Arsip:'archive'}[H],l=S.tasks.filter(t=>t.status==m).sort(srt).reverse();
return `<h2>📂 Riwayat</h2><div class=tabs>${['Selesai','Dibatalkan','Arsip'].map(x=>`<button class="${H==x?'on':''}" onclick="H='${x}';render()">${x}</button>`).join('')}</div>${l.map(t=>`<div class=card><b>${esc(t.title)}</b> <small>${t.date}</small><div class=row><button class="btn s" onclick="setSt(${t.id},'todo')">Pulihkan</button>${m=='done'?`<button class="btn s" onclick="setSt(${t.id},'archive')">Arsipkan</button>`:''}</div></div>`).join('')||'<p class=m>Kosong</p>'}`}
function sync(){return `<h2>☁️ Sinkronisasi</h2><div class=card>Backup/Export: salin teks di bawah dan simpan (WhatsApp/Catatan/Drive).</div><div class=row><button class=btn onclick="$('#io').value=JSON.stringify(S);toast('Backup siap, salin teksnya')">💾 Backup</button><button class="btn s" onclick="exportCsv()">📊 Export Excel (CSV)</button></div><textarea id=io rows=8 placeholder="Tempel backup di sini untuk Restore"></textarea><button class=btn onclick="restore()">♻️ Restore Data</button><h3>Segera hadir</h3><div class="card m">Google Calendar · Backup Google Drive · Export PDF · Login Google (perlu setup Google Cloud)</div>`}
function exportCsv(){const r=[['Judul','Tanggal','Mulai','Selesai','Kategori','Prioritas','Status']].concat(S.tasks.map(t=>[t.title,t.date,t.start,t.end,t.cat,t.prio,t.status]));$('#io').value=r.map(x=>x.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');toast('CSV siap, salin & tempel ke Excel')}
function restore(){try{const d=JSON.parse($('#io').value);if(!d.tasks)throw 0;S=d;save();S.tasks.forEach(sched);applyTheme();render();toast('Data dipulihkan')}catch(e){toast('Format backup tidak valid')}}
function ai(){return `<h2>🤖 AI Assistant</h2><div class=card>Ketik atau ucapkan, contoh:<br><i>Meeting dengan tim besok jam 8 pagi</i><br><i>Ingatkan saya bayar listrik tanggal 5 jam 8 malam</i></div><textarea id=aiq rows=3 placeholder="Tulis kegiatan..."></textarea><div class=row><button class=btn onclick="mic()">🎤 Suara</button><button class=btn onclick="runAI()">✨ Buat Kegiatan</button></div><small class=m>Parser lokal (tanpa internet).</small>`}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Input suara tidak didukung di perangkat ini');const r=new R();r.lang='id-ID';r.onresult=e=>{$('#aiq').value=e.results[0][0].transcript;runAI()};r.onerror=()=>toast('Gagal mendengar suara');r.start()}
function parseQ(q){let s=q.toLowerCase(),d=new Date(),h=9,mi=0,cat='Lainnya';if(/besok/.test(s))d=add(d,1);if(/lusa/.test(s))d=add(d,2);const tg=s.match(/tanggal\s+(\d{1,2})/);if(tg){d=new Date(d.getFullYear(),d.getMonth(),+tg[1]);if(d<add(new Date(),-1))d=new Date(d.getFullYear(),d.getMonth()+1,+tg[1])}
const j=s.match(/jam\s+(\d{1,2})(?:[.:](\d{2}))?\s*(pagi|siang|sore|malam)?/);if(j){h=+j[1];mi=+(j[2]||0);if(/sore|malam/.test(j[3]||'')&&h<12)h+=12;if(j[3]=='siang'&&h<11)h+=12}
if(/meeting|rapat/.test(s))cat='Meeting';else if(/bayar|tagihan|listrik|cicil/.test(s))cat='Keuangan';else if(/beli|belanja/.test(s))cat='Belanja';else if(/dokter|obat/.test(s))cat='Kesehatan';else if(/kerja|laporan|proyek/.test(s))cat='Pekerjaan';
let t=q.replace(/ingatkan( saya)?/i,'').replace(/(hari ini|besok|lusa)/ig,'').replace(/tanggal\s+\d{1,2}/ig,'').replace(/jam\s+\d{1,2}([.:]\d{2})?\s*(pagi|siang|sore|malam)?/ig,'').replace(/dengan/i,'').replace(/\s+/g,' ').trim();t=t.charAt(0).toUpperCase()+t.slice(1);
return{title:t||q,date:ds(d),start:pad(h)+':'+pad(mi),remind:15,alarm:true,cat}}
function runAI(){const q=($('#aiq').value||'').trim();if(!q)return;openForm(null,parseQ(q))}
function set(){const s=S.set;return `<h2>⚙️ Pengaturan</h2><h3>Tampilan</h3><div class=card><div class=lbl>Mode Gelap<input type=checkbox ${s.dark?'checked':''} onchange="S.set.dark=this.checked;save();applyTheme()"></div><div class=lbl>Bahasa<select style="width:auto"><option>Indonesia</option></select></div></div>
<h3>Notifikasi</h3><div class=card><div class=lbl>Suara alarm<select style="width:auto" onchange="S.set.sound=this.value;save()">${Object.entries(TONES).map(([k,v])=>`<option value="${k}" ${tk(s.sound)==k?'selected':''}>${v.n}</option>`).join('')}</select></div><button class="btn s" onclick="playTone(S.set.sound)">▶ Coba suara</button><div class=lbl>Durasi alarm (detik)<input type=number style="width:80px" value="${s.dur}" onchange="S.set.dur=+this.value;save()"></div><div class=lbl>Getar<input type=checkbox ${s.vib?'checked':''} onchange="S.set.vib=this.checked;save()"></div><div class=lbl>Notifikasi layar penuh<input type=checkbox ${s.full?'checked':''} onchange="S.set.full=this.checked;save()"></div><div class=lbl>Target mingguan<input type=number style="width:80px" value="${s.target}" onchange="S.set.target=+this.value||40;save()"></div></div>
<h3>Data</h3><div class=row><button class="btn s" onclick="go('sync')">Backup / Restore</button><button class="btn" style="background:#dc2626" onclick="if(confirm('Hapus SEMUA data?')){S.tasks.forEach(t=>{t.status='cancel';sched(t)});S.tasks=[];S.hist=[];save();render()}">Hapus Data</button></div>
<h3>Akun</h3><div class="card m">Login Google: segera hadir</div><h3>Tentang</h3><div class=card>TaskAlarm Pro v1.0.0<br><small>Kebijakan privasi: semua data tersimpan lokal di perangkat Anda.<br>Bantuan: lihat README di repo GitHub.</small></div>`}
function openForm(id,d){const t=id?S.tasks.find(x=>x.id==id):Object.assign({title:'',desc:'',loc:'',note:'',date:TD(),start:'09:00',end:'',alarm:true,sound:S.set.sound,vib:true,repeat:'',remind:15,prio:'Sedang',cat:'Lainnya'},d||{});M.id=id;
const o=(a,v)=>a.map(x=>`<option value="${x[0]}" ${x[0]==v?'selected':''}>${x[1]}</option>`).join(''),std=[0,5,15,30,60].includes(+t.remind);
$('#modal').innerHTML=`<div class=sheet><h3>${id?'Edit':'Tambah'} Kegiatan</h3><input id=f_title placeholder="Judul kegiatan" value="${esc(t.title)}"><textarea id=f_desc rows=2 placeholder="Deskripsi">${esc(t.desc)}</textarea><input id=f_loc placeholder="📍 Lokasi" value="${esc(t.loc)}"><input id=f_note placeholder="Catatan" value="${esc(t.note)}">
<div class=row><input id=f_date type=date value="${t.date}"><input id=f_start type=time value="${t.start}"><input id=f_end type=time value="${t.end}"></div>
<div class=lbl>⏰ Alarm aktif<input id=f_alarm type=checkbox ${t.alarm?'checked':''}></div><div class=lbl>📳 Getar<input id=f_vib type=checkbox ${t.vib?'checked':''}></div>
<select id=f_repeat>${o([['','Tidak berulang'],['day','Setiap hari'],['week','Setiap minggu']],t.repeat)}</select>
<select id=f_remind>${o([[0,'Tepat waktu'],[5,'5 menit sebelumnya'],[15,'15 menit sebelumnya'],[30,'30 menit sebelumnya'],[60,'1 jam sebelumnya'],['c','Custom (menit)']],std?+t.remind:'c')}</select><input id=f_custom type=number placeholder="Menit custom" value="${std?'':t.remind}">
<select id=f_prio>${o([['Tinggi','🔴 Tinggi'],['Sedang','🟡 Sedang'],['Rendah','🟢 Rendah']],t.prio)}</select><select id=f_cat>${o(Object.entries(CATS).map(([k,v])=>[k,v[0]+' '+k]),t.cat)}</select>
<div class=row><select id=f_sound>${o(Object.entries(TONES).map(([k,v])=>[k,'🔔 '+v.n]),tk(t.sound))}</select><button class="btn s" onclick="playTone($('#f_sound').value)">▶ Coba</button></div><div class=row><button class="btn s" onclick="$('#modal').className=''">Batal</button><button class=btn onclick="saveF()">Simpan</button></div></div>`;$('#modal').className='on'}
function saveF(){const v=i=>$('#f_'+i).value,c=i=>$('#f_'+i).checked;if(!v('title').trim())return toast('Judul wajib diisi');let rm=v('remind');rm=rm=='c'?(+v('custom')||0):+rm;
const o={title:v('title').trim(),desc:v('desc'),loc:v('loc'),note:v('note'),date:v('date'),start:v('start'),end:v('end'),alarm:c('alarm'),vib:c('vib'),repeat:v('repeat'),remind:rm,prio:v('prio'),cat:v('cat'),sound:v('sound')};let t;
if(M.id){t=S.tasks.find(x=>x.id==M.id);Object.assign(t,o)}else{t=Object.assign({id:Date.now()%2000000000,status:'todo',created:Date.now()},o);S.tasks.push(t)}
t.fired=false;save();sched(t);$('#modal').className='';render();toast('Kegiatan tersimpan')}
const NAV=[['home','🏠','Home'],['cal','📅','Kalender'],['tasks','✅','Tugas'],['stats','📊','Statistik'],['set','⚙️','Pengaturan']],VW={home,cal,tasks,stats,set,alarm,hist,sync,ai};
function go(v){V=v;render();scrollTo(0,0)}
function render(){$('#nav').innerHTML=NAV.map(n=>`<button class="${V==n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');const m=$('#main'),y=scrollY;m.innerHTML=VW[V]();scrollTo(0,y)}
function applyTheme(){document.body.className=S.set.dark?'dark':''}
applyTheme();render();initN();checkPast();setInterval(checkPast,30000);
